[project]
name = "pipen-board"
dynamic = ["version"]
description = "Visualization configuration and running of pipen pipelines on the web"
authors = [{name = "pwwang", email = "pwwang@pwwang.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "quart>=0.20",
    "psutil>=7",
    "websocket-client>=1.8",
    "python-slugify>=8",
    "pipen-args>=1.2",
    "pipen-log2file>=1.1",
    "taskgroup>=0.2; python_version < '3.11'",
]

[project.optional-dependencies]
report = ["pipen-report>=1.2"]
diagram = ["pipen-diagram>=1.1"]
filters = ["pipen-filters>=1.1"]
all = ["pipen-report>=1.2", "pipen-diagram>=1.1", "pipen-filters>=1.1"]

[project.urls]
Homepage = "https://github.com/pwwang/pipen-board"
Repository = "https://github.com/pwwang/pipen-board"

[project.entry-points.pipen]
board = "pipen_board:pipen_board_plugin"

[project.entry-points.pipen_cli]
cli-board = "pipen_board:PipenCliBoardPlugin"

[dependency-groups]
dev = [
    "cloudsh>=0.3",
    "python-dotenv>=1",
    "panpath[gs,async-gs]>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "pipen_board/version.py"

[tool.hatch.build]
exclude = [
    "pipen_board/frontend/[!build]*",
    "pipen_board/frontend/index.html",
]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
